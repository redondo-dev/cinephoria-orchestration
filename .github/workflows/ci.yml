name: CI Orchestration - Tests d'integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout des 3 repos, disposes cote a cote comme en local
      # (docker-compose.ci.yml reference ../cinephoria-backend et ../cinephoria-frontend)
      - name: Checkout orchestration
        uses: actions/checkout@v4
        with:
          path: cinephoria-orchestration

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: redondo-dev/cinephoria-backend
          ref: main
          path: cinephoria-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: redondo-dev/cinephoria-frontend
          ref: main
          path: cinephoria-frontend

      - name: Verifier l'arborescence
        run: |
          ls -la
          ls -la cinephoria-backend/backend
          ls -la cinephoria-frontend

      - name: Build et demarrage des services
        working-directory: cinephoria-orchestration
        run: docker compose -f docker-compose.ci.yml up --build -d
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Vérifier les conteneurs Docker
        working-directory: cinephoria-orchestration
        run: docker compose -f docker-compose.ci.yml ps

      - name: Attendre que le backend soit pret
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Attendre que le frontend soit pret
        run: npx wait-on http://localhost:8080/health --timeout 60000

      - name: Vérifier les healthchecks Docker
        run: |
          docker inspect cinephoria-backend-ci --format='{{.State.Health.Status}}'
          docker inspect cinephoria-frontend-ci --format='{{.State.Health.Status}}'
          docker inspect cinephoria-postgres-ci --format='{{.State.Health.Status}}'

      - name: Derniers logs Docker
        if: always()
        working-directory: cinephoria-orchestration
        run: docker compose -f docker-compose.ci.yml logs --tail=50

      - name: Seed des donnees de test dans le conteneur backend
        working-directory: cinephoria-orchestration
        run: docker compose -f docker-compose.ci.yml exec -T backend npm run seed:test

      - name: Installer les dependances Cypress
        working-directory: cinephoria-frontend
        run: npm ci

      - name: Lancer les tests d'integration Cypress (securite + API + contraintes DB) contre l'environnement integre
        working-directory: cinephoria-frontend
        run: npx cypress run --env NODE_ENV=development --config baseUrl=http://localhost:8080 --spec "cypress/e2e/securite/**/*.cy.ts,cypress/e2e/api/auth.cy.ts,cypress/e2e/api/film.cy.ts,cypress/e2e/api/reservations.cy.ts,cypress/e2e/api/db.constraints.cy.ts"

      - name: Verifier le backend
        run: |
          curl -f http://localhost:3000/health || exit 1
          curl -f http://localhost:3000/api/films || exit 1

      - name: Verifier le frontend
        run: curl -f http://localhost:8080/health || exit 1

      - name: Afficher les logs en cas d'echec
        if: failure()
        working-directory: cinephoria-orchestration
        run: docker compose -f docker-compose.ci.yml logs

      - name: Nettoyer
        if: always()
        working-directory: cinephoria-orchestration
        run: docker compose -f docker-compose.ci.yml down -v
